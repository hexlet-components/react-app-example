# frontend это отдельный пакет со своим package.json. Описан как workspace,
# поэтому один `pnpm install` в корне ставит зависимости обоим, и отдельный
# postinstall с ручным `cd frontend` больше не нужен.
packages:
  - frontend

# pnpm с 10-й версии не запускает build-скрипты зависимостей без явного
# разрешения. Этим он нужен: они собирают нативный модуль или доустанавливают
# полифилы, и без этого ломается не установка, а сборка.
#
# Файл всегда переписывается целиком: pnpm при отказе дописывает сюда свой
# блок allowBuilds с заглушками, и дописывание сверху даёт дубль ключа, на
# котором YAML перестаёт разбираться.
allowBuilds:
  '@parcel/watcher': true
  # @swc/core приезжает зависимостью i18next-cli, его postinstall только
  # проверяет нативный биндинг: ни установке, ни сборке он не нужен.
  '@swc/core': false
  core-js: true
  core-js-pure: true
